<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-tools</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #17140f;
    --panel: #1d1911;
    --panel-2: #221d14;
    --line: #3a3122;
    --line-soft: #2a2418;
    --text: #ece5d6;
    --text-dim: #9c9078;
    --text-faint: #6e6552;
    --amber: #e2a545;
    --amber-dim: #a97e3c;
    --amber-bg: #2c2211;
    --red: #d9705f;
    --green: #7fae6a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
    background: var(--bg); color: var(--text); font-size: 13.5px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  ::selection { background: var(--amber); color: #1a1509; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 0; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    padding: 0 1rem; height: 44px; background: var(--panel); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 0.9rem; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; letter-spacing: 0.01em; }
  .brand .mark { width: 8px; height: 8px; background: var(--amber); flex-shrink: 0; }
  .brand-name { color: var(--text); font-size: 0.9rem; }
  .rootpill {
    color: var(--text-dim); font-size: 0.75rem; padding: 0.2rem 0.55rem; border: 1px solid var(--line-soft);
    max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .spacer { flex: 1; }
  .authbadge { font-size: 0.72rem; color: var(--text-faint); border: 1px solid var(--line-soft); padding: 0.2rem 0.5rem; }

  #msg { padding: 0 1rem; height: 0; overflow: hidden; font-size: 0.78rem; transition: height 0.15s ease; flex-shrink: 0; }
  #msg.show { height: 28px; display: flex; align-items: center; }
  #msg.error { color: var(--red); background: #2a1512; }
  #msg.ok { color: var(--green); background: #142016; }

  main { flex: 1; display: flex; min-height: 0; }

  #files { width: 300px; min-width: 200px; max-width: 46vw; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); resize: horizontal; overflow: hidden; }
  #breadcrumb {
    padding: 0.55rem 0.7rem; border-bottom: 1px solid var(--line); font-size: 0.76rem; color: var(--text-dim);
    word-break: break-all; display: flex; flex-wrap: wrap; align-items: center; gap: 0.15rem;
  }
  #breadcrumb button { background: none; border: none; color: var(--amber); cursor: pointer; font: inherit; padding: 0.1rem 0; }
  #breadcrumb button:hover { text-decoration: underline; }
  #breadcrumb .sep { color: var(--text-faint); }

  #entries { flex: 1; overflow-y: auto; }
  .entry {
    padding: 0.38rem 0.7rem; padding-left: 0.55rem; cursor: pointer; display: flex; align-items: center;
    gap: 0.5rem; white-space: nowrap; overflow: hidden; border-left: 2px solid transparent;
  }
  .entry:hover { background: var(--panel-2); border-left-color: var(--amber-dim); }
  .entry .glyph { flex-shrink: 0; width: 12px; text-align: center; color: var(--text-faint); font-size: 0.85rem; }
  .entry.dir .glyph { color: var(--amber-dim); }
  .entry .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .entry.dir .name { color: var(--text); }
  .entry.file .name { color: var(--text-dim); }
  .entry .size { color: var(--text-faint); font-size: 0.72rem; flex-shrink: 0; }
  .entry .del { color: var(--text-faint); opacity: 0; flex-shrink: 0; padding: 0 0.2rem; }
  .entry .del:hover { color: var(--red); }
  .entry:hover .del { opacity: 1; }
  .empty { padding: 1rem 0.7rem; color: var(--text-faint); font-size: 0.8rem; }

  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); flex-shrink: 0; }
  .tab {
    padding: 0.6rem 1.1rem; cursor: pointer; color: var(--text-dim); font-size: 0.82rem;
    border-bottom: 2px solid transparent; user-select: none;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--amber); border-color: var(--amber); }

  .pane { flex: 1; display: none; min-height: 0; flex-direction: column; }
  .pane.active { display: flex; }

  #editorPath {
    padding: 0.5rem 0.9rem; color: var(--text-dim); font-size: 0.78rem; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-shrink: 0; background: var(--panel-2);
  }
  button.savebtn, button.run {
    background: var(--amber-bg); border: 1px solid var(--amber-dim); color: var(--amber);
    padding: 0.32rem 0.8rem; cursor: pointer; font: inherit; font-size: 0.78rem;
  }
  button.savebtn:hover, button.run:hover { border-color: var(--amber); }
  button.savebtn:disabled, button.run:disabled { opacity: 0.4; cursor: default; border-color: var(--line); color: var(--text-faint); background: none; }
  button.savebtn kbd { font-size: 0.68rem; color: var(--text-faint); margin-left: 0.4rem; }

  #editor {
    flex: 1; width: 100%; background: var(--bg); color: var(--text); border: none; resize: none;
    padding: 0.9rem 1rem; font: inherit; line-height: 1.55; outline: none; tab-size: 2;
  }
  #editor::placeholder { color: var(--text-faint); }

  #termCwdRow { display: flex; gap: 0.6rem; padding: 0.55rem 0.9rem; border-bottom: 1px solid var(--line); align-items: center; background: var(--panel-2); flex-shrink: 0; }
  #termCwdRow .label { color: var(--text-faint); font-size: 0.76rem; flex-shrink: 0; }
  #termCwd { flex: 1; background: var(--bg); border: 1px solid var(--line-soft); color: var(--text); padding: 0.32rem 0.55rem; font: inherit; font-size: 0.8rem; }
  #termCwd:focus { outline: none; border-color: var(--amber-dim); }

  #cmdRow { display: flex; gap: 0.6rem; padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  #cmdInput {
    flex: 1; background: var(--bg); border: 1px solid var(--line-soft); color: var(--text);
    padding: 0.5rem 0.7rem; font: inherit; caret-color: var(--amber);
  }
  #cmdInput:focus { outline: none; border-color: var(--amber-dim); }
  #cmdInput::placeholder { color: var(--text-faint); }

  #output { flex: 1; overflow-y: auto; padding: 0.9rem; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  #output .cmdline { color: var(--amber); margin-top: 0.7rem; }
  #output .cmdline:first-child { margin-top: 0; }
  #output .cmdline::before { content: "\276F "; }
  #output .stdout { color: var(--text); }
  #output .stderr { color: var(--red); }
  #output .meta { color: var(--text-faint); font-size: 0.74rem; margin-bottom: 0.2rem; }
  #output-empty { padding: 0.9rem; color: var(--text-faint); font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"></span><span class="brand-name">pi-tools</span></div>
  <span class="rootpill" id="rootLabel"></span>
  <div class="spacer"></div>
  <span class="authbadge" id="authBadge"></span>
</header>
<div id="msg"></div>
<main>
  <div id="files">
    <div id="breadcrumb"></div>
    <div id="entries"></div>
  </div>
  <div id="right">
    <div class="tabs">
      <div class="tab active" data-tab="editor">Editor</div>
      <div class="tab" data-tab="terminal">Terminal</div>
    </div>
    <div class="pane active" id="pane-editor">
      <div id="editorPath">
        <span id="editorPathLabel">No file open</span>
        <button class="savebtn" id="saveBtn" disabled>Save<kbd>&#8984;S</kbd></button>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Select a file on the left to view or edit it here."></textarea>
    </div>
    <div class="pane" id="pane-terminal">
      <div id="termCwdRow">
        <span class="label">cwd</span>
        <input id="termCwd" value=".">
      </div>
      <div id="cmdRow">
        <input id="cmdInput" placeholder="git pull &amp;&amp; sudo systemctl restart radar" autocomplete="off">
        <button class="run" id="runBtn">Run</button>
      </div>
      <div id="output"><div id="output-empty">Output from commands you run will appear here.</div></div>
    </div>
  </div>
</main>
<script>
(function () {
  let TOKEN = localStorage.getItem('pi-tools-token') || '';
  let currentDir = '.';
  let currentFile = null;

  function headers(extra) {
    const h = Object.assign({}, extra || {});
    if (TOKEN) h['X-Auth-Token'] = TOKEN;
    return h;
  }

  async function api(path, opts) {
    const res = await fetch(path, Object.assign({}, opts, { headers: headers((opts && opts.headers) || (opts && opts.json ? { 'Content-Type': 'application/json' } : {})) }));
    if (res.status === 401) {
      const t = prompt('Enter pi-tools token:');
      if (t) { TOKEN = t; localStorage.setItem('pi-tools-token', t); setAuthBadge(); return api(path, opts); }
      throw new Error('Unauthorized');
    }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  function setAuthBadge() {
    document.getElementById('authBadge').textContent = TOKEN ? 'token set' : '';
  }
  setAuthBadge();

  function showMsg(text, cls) {
    const el = document.getElementById('msg');
    el.textContent = text || '';
    el.className = text ? 'show ' + (cls || '') : '';
    if (text) setTimeout(() => { if (el.textContent === text) el.className = ''; }, 4000);
  }

  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  async function loadDir(rel) {
    try {
      const data = await api('/api/list?path=' + encodeURIComponent(rel));
      currentDir = data.path;
      document.getElementById('rootLabel').textContent = data.root;
      renderBreadcrumb();
      renderEntries(data.entries);
      document.getElementById('termCwd').value = currentDir;
    } catch (err) { showMsg(err.message, 'error'); }
  }

  function renderBreadcrumb() {
    const box = document.getElementById('breadcrumb');
    box.textContent = '';
    const parts = currentDir === '.' ? [] : currentDir.split('/');
    const rootBtn = document.createElement('button');
    rootBtn.textContent = 'root';
    rootBtn.onclick = () => loadDir('.');
    box.appendChild(rootBtn);
    let acc = '';
    parts.forEach((p) => {
      acc = acc ? acc + '/' + p : p;
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = ' / ';
      box.appendChild(sep);
      const btn = document.createElement('button');
      btn.textContent = p;
      const target = acc;
      btn.onclick = () => loadDir(target);
      box.appendChild(btn);
    });
  }

  function renderEntries(entries) {
    const box = document.getElementById('entries');
    box.textContent = '';
    if (!entries.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Empty directory';
      box.appendChild(e);
      return;
    }
    entries.forEach((entry) => {
      const row = document.createElement('div');
      row.className = 'entry ' + (entry.isDir ? 'dir' : 'file');
      const glyph = document.createElement('span');
      glyph.className = 'glyph';
      glyph.textContent = entry.isDir ? '\276F' : '\00B7';
      row.appendChild(glyph);
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;
      row.appendChild(name);
      const size = document.createElement('span');
      size.className = 'size';
      size.textContent = entry.isDir ? '' : fmtSize(entry.size);
      row.appendChild(size);
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '\00D7';
      del.title = 'Delete';
      del.onclick = (ev) => {
        ev.stopPropagation();
        const relPath = currentDir === '.' ? entry.name : currentDir + '/' + entry.name;
        if (!confirm('Delete ' + relPath + '?')) return;
        api('/api/delete', { method: 'POST', json: true, body: JSON.stringify({ path: relPath }) })
          .then(() => loadDir(currentDir))
          .catch((err) => showMsg(err.message, 'error'));
      };
      row.appendChild(del);
      row.onclick = () => {
        const relPath = currentDir === '.' ? entry.name : currentDir + '/' + entry.name;
        if (entry.isDir) loadDir(relPath);
        else openFile(relPath);
      };
      box.appendChild(row);
    });
  }

  async function openFile(relPath) {
    try {
      const data = await api('/api/read?path=' + encodeURIComponent(relPath));
      currentFile = data.path;
      document.getElementById('editorPathLabel').textContent = data.path;
      document.getElementById('editor').value = data.content;
      document.getElementById('saveBtn').disabled = false;
      switchTab('editor');
    } catch (err) { showMsg(err.message, 'error'); }
  }

  async function saveFile() {
    if (!currentFile) return;
    try {
      await api('/api/write', { method: 'POST', json: true, body: JSON.stringify({ path: currentFile, content: document.getElementById('editor').value }) });
      showMsg('Saved ' + currentFile, 'ok');
    } catch (err) { showMsg(err.message, 'error'); }
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('active', p.id === 'pane-' + name));
  }

  async function runCommand() {
    const cmd = document.getElementById('cmdInput').value;
    if (!cmd.trim()) return;
    const cwd = document.getElementById('termCwd').value || '.';
    const out = document.getElementById('output');
    const emptyMsg = document.getElementById('output-empty');
    if (emptyMsg) emptyMsg.remove();
    const line = document.createElement('div');
    line.className = 'cmdline';
    line.textContent = cmd + '  (' + cwd + ')';
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
    const runBtn = document.getElementById('runBtn');
    runBtn.disabled = true;
    try {
      const data = await api('/api/run', { method: 'POST', json: true, body: JSON.stringify({ cwd, command: cmd }) });
      if (data.stdout) {
        const o = document.createElement('div');
        o.className = 'stdout';
        o.textContent = data.stdout;
        out.appendChild(o);
      }
      if (data.stderr) {
        const e = document.createElement('div');
        e.className = 'stderr';
        e.textContent = data.stderr;
        out.appendChild(e);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = data.error ? data.error : ('exit ' + data.code);
      out.appendChild(meta);
    } catch (err) {
      const e = document.createElement('div');
      e.className = 'stderr';
      e.textContent = err.message;
      out.appendChild(e);
    } finally {
      runBtn.disabled = false;
      out.scrollTop = out.scrollHeight;
      document.getElementById('cmdInput').value = '';
      document.getElementById('cmdInput').focus();
    }
  }

  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => switchTab(t.dataset.tab));
  document.getElementById('saveBtn').onclick = saveFile;
  document.getElementById('runBtn').onclick = runCommand;
  document.getElementById('cmdInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') runCommand(); });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
  });

  loadDir('.');
})();
</script>
</body>
</html>
